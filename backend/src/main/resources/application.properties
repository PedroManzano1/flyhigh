spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/db_flyhigh
spring.datasource.username=postgres
spring.jpa.hibernate.ddl-auto=update

# Segredos ficam fora do git. Ordem de procura:
#   1. variaveis de ambiente DB_PASSWORD e JWT_SECRET (servidor de producao);
#   2. o arquivo application-local.properties nesta mesma pasta (no .gitignore),
#      criado a partir de application-local.example.properties.
spring.config.import=optional:classpath:application-local.properties
spring.datasource.password=${DB_PASSWORD}
flyhigh.jwt.secret=${JWT_SECRET}

# Criterios de aprovacao usados no boletim (a ERS nao os define)
flyhigh.pedagogico.nota-minima=70.0
flyhigh.pedagogico.frequencia-minima=75.0
